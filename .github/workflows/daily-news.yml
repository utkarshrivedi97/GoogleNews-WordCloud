name: Daily News WordCloud Reports

on:
  schedule:
    # Runs at 22:30 UTC every day = 04:00 AM IST
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  send-reports:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install feedparser requests beautifulsoup4 pycountry wordcloud python-dateutil matplotlib
    
    - name: Run Google News scraper
      env:
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python main.py
    
    - name: Upload wordcloud artifacts (optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wordcloud-images
        path: wordcloud_*.png
        retention-days: 7

    # NEW STEP: Automatically commits a heartbeat file once a week to prevent workflow disablement
    - name: Keepalive Heartbeat
      if: github.event_name == 'schedule' && github.event.schedule == '30 22 * * *' # Only run on scheduled trigger
      run: |
        # Only commit once a week (e.g., on Mondays) to avoid cluttering history
        if [ $(date +%u) -eq 1 ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "Last heartbeat: $(date)" > heartbeat.txt
          git add heartbeat.txt
          git commit -m "Automated activity heartbeat [skip ci]"
          git push
        fi
